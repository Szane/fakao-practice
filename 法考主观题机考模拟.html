<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2213%22%20fill%3D%22%23B02A22%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2246%22%20font-size%3D%2243%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Songti%20SC%2CSimSun%2Cserif%22%20font-weight%3D%22700%22%3E%E6%B3%95%3C%2Ftext%3E%3C%2Fsvg%3E">
<title>法考主观题机考模拟</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600&display=swap">

<style>
/* ============================================================================
   外观参照 国家统一法律职业资格考试计算机化考试模拟答题系统（主观题）。
   这是刻意只做一套亮色的设计——考场系统不会跟随系统深色模式，
   所以不写 prefers-color-scheme，每个颜色都显式声明。
   ============================================================================ */
:root{
  --blue:      #61ABE8;   /* 顶栏 / 面板标题条 */
  --blue-dk:   #4E9BDC;
  --panel:     #DDEBF6;   /* 左栏、工具条底色 */
  --paper:     #F9FDFF;   /* 材料区 */
  --answerbg:  #EAF4FB;   /* 答题区 */
  --bar:       #E3F0F9;   /* 次级底色 */
  --line:      #98AEE8;   /* 按钮边框 */
  --line-soft: #BCD0F0;
  --line-hard: #6E8FD0;
  --tabon:     #FFBB00;   /* 激活的问题标签 */
  --tabon-dk:  #D89A00;
  --red:       #FA0000;
  --amber:     #F5A623;
  --ink:       #333333;
  --ink-2:     #5A6B7C;
  --ink-3:     #8A99A8;
  --btn-t:     #F7FAFE;
  --btn-b:     #E4EDFA;
  --btn-t-on:  #FFFFFF;
  --btn-b-on:  #EAF2FD;

  --sans:"Microsoft YaHei","PingFang SC","Noto Sans SC","Hiragino Sans GB",sans-serif;
  --song:SimSun,"Songti SC","Noto Serif SC","STSong",serif;
  --mono:"Consolas","Courier New",monospace;

  --r:2px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--panel);
  color:var(--ink);
  font-family:var(--sans);
  font-size:12px;
  line-height:1.5;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--blue-dk);outline-offset:1px}
::-webkit-scrollbar{width:15px;height:15px}
::-webkit-scrollbar-track{background:#EDF3FA}
::-webkit-scrollbar-thumb{background:#B9CCE4;border:1px solid #EDF3FA}
::-webkit-scrollbar-thumb:hover{background:#9FB6D4}

/* ---------- 经典 3D 按钮（参照里的按钮是浅蓝渐变+蓝边） ---------- */
.btn3d{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  height:22px;padding:0 9px;
  font-size:12px;color:#22344A;
  background:linear-gradient(to bottom,var(--btn-t),var(--btn-b));
  border:1px solid var(--line);
  border-radius:var(--r);
  white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
  transition:background .1s,border-color .1s;
}
.btn3d:hover{background:linear-gradient(to bottom,#FFF,#DCE9FA);border-color:var(--line-hard)}
.btn3d:active{background:linear-gradient(to bottom,#D8E6F8,#EEF4FD);box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.btn3d[disabled]{color:#9DAEC2;background:linear-gradient(to bottom,#FBFCFE,#F0F4FA);border-color:var(--line-soft);cursor:default;box-shadow:none}
.btn3d.on{background:linear-gradient(to bottom,#FFE9A8,#FFD24D);border-color:var(--tabon-dk);color:#4A3400;font-weight:700}
.btn3d .ic{font-size:11px;line-height:1;opacity:.85}

/* ============================================================================
   顶栏
   ============================================================================ */
.exam{height:100dvh;display:flex;flex-direction:column}
.topbar{
  flex:none;height:82px;
  background:var(--blue);
  display:flex;align-items:center;gap:14px;
  padding:0 10px 0 8px;
  color:#fff;
  position:relative;
}
.cand{display:flex;align-items:center;gap:9px;flex:none}
.cand-photo{
  width:56px;height:66px;flex:none;
  background:#EAF3FC;border:1px solid #fff;border-radius:2px;
  display:block;overflow:hidden;
}
.cand-info{font-size:12px;line-height:1.55;white-space:nowrap}
.cand-info b{font-weight:400}
.cand-info .lab{color:#EAF4FF}

.exam-title{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;
}
.exam-title .t1{font-size:15px;font-weight:700;letter-spacing:.5px;text-shadow:0 1px 1px rgba(0,0,0,.18)}
.exam-title .t2{font-size:12.5px;margin-top:3px;text-shadow:0 1px 1px rgba(0,0,0,.18)}

.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.timer{font-size:12.5px;color:#FFF200;text-shadow:0 1px 1px rgba(0,0,0,.25);white-space:nowrap}
.timer b{font-family:var(--mono);font-weight:400;letter-spacing:.4px}
.btn-submit{
  height:26px;padding:0 15px;
  font-size:13px;font-weight:700;color:#4A3400;
  background:linear-gradient(to bottom,#FFF86B,#FFD21E);
  border:1px solid #D9A400;border-radius:var(--r);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 1px 2px rgba(0,0,0,.18);
}
.btn-submit:hover{background:linear-gradient(to bottom,#FFFA9A,#FFDC48)}
.rail-toggle{
  position:absolute;right:96px;top:0;
  height:17px;padding:0 9px;
  font-size:10.5px;color:#7A3E00;
  background:linear-gradient(to bottom,#FFE07A,#FFC53D);
  border:1px solid #D9A400;border-top:0;border-radius:0 0 3px 3px;
  display:flex;align-items:center;gap:3px;
}

/* ============================================================================
   主体：左栏 + 右主区
   ============================================================================ */
.body{flex:1;min-height:0;display:flex;gap:4px;padding:4px;background:var(--panel)}
.rail{
  flex:none;width:202px;min-width:0;
  background:var(--panel);
  border:1px solid var(--line-soft);
  display:flex;flex-direction:column;
  transition:width .18s ease;
  overflow:hidden;
}
.rail[data-collapsed="1"]{width:22px}
.rail[data-collapsed="1"] .rail-inner{visibility:hidden}
.rail-head{
  flex:none;height:24px;
  background:var(--blue);color:#fff;
  display:flex;align-items:center;padding:0 6px;
  font-size:12px;font-weight:700;
}
.rail-head button{
  margin-left:auto;font-size:11px;font-weight:400;color:#EAF4FF;
  display:flex;align-items:center;gap:3px;
}
.rail-head button:hover{color:#fff;text-decoration:underline}
.rail-inner{flex:1;min-height:0;overflow:auto;padding:6px}
.rail[data-collapsed="1"] .rail-head{writing-mode:vertical-rl;height:100%;width:22px;padding:6px 0;justify-content:flex-start}
.rail[data-collapsed="1"] .rail-head button{display:none}
.qchips{display:flex;flex-wrap:wrap;gap:4px;padding:2px 0 8px}
/* 用 flex 而非 grid：grid 会把 <sup> 变成独立的一行，星号会掉到数字下面 */
.qchip{
  position:relative;
  width:26px;height:23px;
  display:flex;align-items:center;justify-content:center;
  font-size:12.5px;color:#1A2B3C;
  background:linear-gradient(to bottom,#FBFDFF,#E7F0FB);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:inset 0 1px 0 #fff;
}
.qchip:hover{border-color:var(--line-hard);background:linear-gradient(to bottom,#fff,#DCEAFA)}
.qchip[data-cur="1"]{background:linear-gradient(to bottom,#FFE9A8,#FFD24D);border-color:var(--tabon-dk);font-weight:700}
.qchip sup{
  align-self:flex-start;margin-top:1px;
  color:var(--red);font-size:10px;line-height:1;
}
.qchip sup.mark{color:#E08A00}
.legend{font-size:10.5px;line-height:1.7;padding:2px 0 10px;letter-spacing:-.2px}
.legend .h{color:#4A87C4;margin:0 0 2px}
.legend p{margin:0;color:var(--red)}
.legend p.q{color:var(--ink-2)}
.rail-center{text-align:center;padding:4px 0 12px}

/* 我的附加功能：视觉上刻意弱化，不抢参照的观感 */
.rail-tools{
  margin-top:14px;padding-top:10px;
  border-top:1px dashed var(--line-soft);
  font-size:11px;color:var(--ink-2);
}
.rail-tools .rt-h{
  color:var(--ink-3);letter-spacing:2px;margin-bottom:7px;font-size:10px;
}
.rail-tools .btn3d{width:100%;height:24px;margin-bottom:5px;font-size:11px}
.rt-stat{padding:3px 1px;color:var(--ink-2);font-size:11.5px}
.rt-stat b{font-family:var(--mono);color:#1A5FA8;font-size:13px}
.rt-note{color:var(--ink-3);font-size:10.5px;line-height:1.6;margin-top:6px}

/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mat-wrap,.ans-wrap{
  display:flex;flex-direction:column;min-height:0;
  border:1px solid var(--line-soft);
  background:var(--paper);
}
.mat-wrap{flex:1 1 46%}
.ans-wrap{flex:1 1 54%;background:var(--answerbg)}
.mat-wrap[data-zoom="1"],.ans-wrap[data-zoom="1"]{position:fixed;inset:4px;z-index:35;flex:none;box-shadow:0 8px 40px rgba(0,0,0,.35)}

.tabstrip{
  flex:none;display:flex;align-items:flex-end;gap:0;
  height:25px;padding:3px 4px 0;
  background:var(--bar);
  border-bottom:1px solid var(--line-soft);
}
.tab{
  height:21px;padding:0 11px;
  font-size:12px;color:#2A4058;
  background:linear-gradient(to bottom,#FBFDFF,#E9F1FB);
  border:1px solid var(--line-soft);border-bottom:0;
  border-radius:3px 3px 0 0;
  margin-right:-1px;
}
.tab:hover{background:linear-gradient(to bottom,#fff,#DCEAFA)}
.tab.on{
  background:linear-gradient(to bottom,#FFFFFF,#E4EFFC);
  border-color:var(--line);border-bottom:1px solid #fff;
  font-weight:700;color:#123E6E;
  position:relative;top:1px;
}
.toolstrip{
  flex:none;display:flex;align-items:center;gap:5px;
  padding:5px 7px;
  background:var(--bar);
  border-bottom:1px solid var(--line-soft);
  min-height:32px;
}
.toolstrip .title{
  font-size:13px;font-weight:700;color:#1A2B3C;white-space:nowrap;
  padding-right:4px;
}
.toolstrip .right{margin-left:auto;display:flex;align-items:center;gap:5px;flex-wrap:nowrap}
.toolsep{width:1px;height:16px;background:var(--line-soft);margin:0 2px}

.mat-body{
  flex:1;min-height:0;overflow:auto;
  padding:16px 22px 30px;
  font-family:var(--song);
  font-size:var(--mfs,15px);
  line-height:1.95;
  color:var(--ink);
}
.mat-body p{margin:0 0 .35em;text-indent:2em;text-align:justify}
.mat-body p.flat{text-indent:0}
.mat-body p.src{text-indent:2em;color:#3A4A5A;font-size:.94em;margin-bottom:.9em}
.mat-body .sec{text-indent:0;font-weight:700;margin:.9em 0 .3em}
.mat-body ol{margin:.2em 0 .9em;padding-left:2.6em}
.mat-body ol li{margin-bottom:.15em}
.mat-body .hl{background:#FFF3A8}
.mat-hint{color:#93A3B4;font-family:var(--sans);font-size:12.5px;text-indent:0}
.mat-hint b{color:#5A6B7C}

/* ---------- 问题标签条 ---------- */
.askstrip{
  flex:none;display:flex;align-items:stretch;gap:0;
  background:var(--bar);
  border-bottom:1px solid var(--line-soft);
  min-height:30px;padding:4px 7px;
}
.asktabs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0}
.asktab{
  height:22px;padding:0 10px;
  font-size:12px;color:#2A4058;
  background:linear-gradient(to bottom,#FBFDFF,#E7F0FB);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:inset 0 1px 0 #fff;
  display:inline-flex;align-items:center;gap:2px;
}
.asktab:hover{border-color:var(--line-hard);background:linear-gradient(to bottom,#fff,#DCEAFA)}
.asktab[data-cur="1"]{
  background:linear-gradient(to bottom,#FFD75E,#FFBB00);
  border-color:var(--tabon-dk);font-weight:700;color:#3D2A00;
}
.asktab sup{align-self:flex-start;margin-top:1px;color:var(--red);font-size:11px;line-height:1}
.asktab[data-cur="1"] sup{color:#8A2000}

.asktext{
  flex:none;padding:6px 10px 0;
  font-family:var(--song);font-size:13px;line-height:1.7;
  color:#1A2B3C;
}
.asktext .no{color:#0F4C81;margin-right:2px}
.asktext .q-hint{color:#93A3B4;font-family:var(--sans);font-size:12px}
.countline{
  flex:none;padding:3px 10px 3px;
  font-size:12px;color:var(--red);
}
.countline b{font-family:var(--mono);font-size:13px;font-weight:400}
.countline .extra{color:var(--ink-2);margin-left:14px;font-size:11.5px}
.countline .extra b{color:#1A5FA8;font-size:12px}

.ans-body{flex:1;min-height:0;display:flex;padding:0 8px 6px}
.answer{
  flex:1;min-width:0;resize:none;outline:none;
  background:#FBFDFF;
  border:1px solid var(--line-soft);
  font-family:var(--song);
  font-size:var(--afs,15px);
  line-height:1.95;
  color:var(--ink);
  padding:10px 14px;
  caret-color:#1A5FA8;
}
.answer:focus{border-color:var(--line);background:#fff}
.answer::placeholder{color:#A9B7C6;font-family:var(--sans);font-size:12px}

.ans-foot{
  flex:none;display:flex;align-items:center;gap:7px;
  padding:5px 8px 6px;
  background:var(--bar);
  border-top:1px solid var(--line-soft);
}
.mark{display:inline-flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;user-select:none;margin-right:2px}
.mark input{margin:0;width:13px;height:13px;accent-color:#E8A200}

/* ============================================================================
   抽屉（历史 / 统计 / 设置）
   ============================================================================ */
.scrim{position:fixed;inset:0;background:rgba(20,40,70,.34);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim[data-open="1"]{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(468px,95vw);
  background:var(--paper);border-left:1px solid var(--line);
  box-shadow:-6px 0 26px rgba(20,40,70,.28);
  transform:translateX(101%);transition:transform .22s cubic-bezier(.3,.7,.3,1);
  z-index:41;display:flex;flex-direction:column;
}
.drawer[data-open="1"]{transform:none}
.drawer-head{
  flex:none;display:flex;align-items:center;gap:3px;
  padding:6px 8px;background:var(--blue);
}
.dtab{
  height:24px;padding:0 13px;font-size:12.5px;color:#EAF4FF;
  border:1px solid transparent;border-radius:var(--r);
}
.dtab:hover{background:rgba(255,255,255,.16)}
.dtab[data-on="1"]{
  background:linear-gradient(to bottom,#FBFDFF,#E4EFFC);
  border-color:var(--line);color:#123E6E;font-weight:700;
}
.drawer-close{margin-left:auto;width:24px;height:24px;font-size:14px;color:#EAF4FF;border-radius:var(--r)}
.drawer-close:hover{background:rgba(255,255,255,.18);color:#fff}
.drawer-body{flex:1;min-height:0;overflow:auto;padding:10px}
.dpanel{display:none}
.dpanel[data-on="1"]{display:block}

.hist-tools{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.hist-meta{font-size:11px;color:var(--ink-3);margin-bottom:9px;display:flex;justify-content:space-between;gap:8px}
.hitem{
  width:100%;text-align:left;display:block;
  background:linear-gradient(to bottom,#FBFDFF,#F0F6FD);
  border:1px solid var(--line-soft);border-radius:var(--r);
  padding:7px 9px;margin-bottom:5px;
}
.hitem:hover{border-color:var(--line);background:linear-gradient(to bottom,#fff,#E7F1FC)}
.hitem[data-on="1"]{border-color:var(--tabon-dk);background:linear-gradient(to bottom,#FFF8E3,#FFEFC4);box-shadow:inset 3px 0 0 var(--tabon)}
.hitem-top{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.hitem-time{font-family:var(--mono);font-size:12px;color:#1A2B3C}
.hitem-badge{font-size:10px;padding:0 5px;border:1px solid var(--line-soft);border-radius:99px;color:var(--ink-2);background:#fff}
.hitem-badge.manual{border-color:#E0A800;color:#8A6000;background:#FFF6DC}
.hitem-badge.restore{border-color:#68B08A;color:#1E6B45;background:#E8F7EF}
.hitem-delta{margin-left:auto;font-family:var(--mono);font-size:11px}
.hitem-delta[data-sign="+"]{color:#12784E}
.hitem-delta[data-sign="-"]{color:var(--red)}
.hitem-delta[data-sign="0"]{color:var(--ink-3)}
.hitem-prev{font-family:var(--song);font-size:11.5px;color:var(--ink-2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.diffbox{
  font-family:var(--song);font-size:13.5px;line-height:2;
  background:#fff;border:1px solid var(--line-soft);padding:11px 13px;
  max-height:min(46vh,400px);overflow:auto;white-space:pre-wrap;word-break:break-word;
}
.diffbox ins{background:#DFF5E7;color:#12784E;text-decoration:none}
.diffbox del{background:#FDE3E3;color:#B01818;text-decoration:line-through}
.diffbox .gap{font-family:var(--sans);font-size:11px;color:var(--ink-3)}
.detail-bar{display:flex;align-items:center;gap:6px;margin:9px 0;flex-wrap:wrap}
.detail-note{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:auto}

.sec-title{
  font-size:11px;color:var(--ink-3);letter-spacing:2px;
  margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line-soft);
}
.sec-title:first-child{margin-top:0}

.stat-hero{background:#fff;border:1px solid var(--line-soft);padding:12px 14px}
.stat-hero .cap{font-size:11px;color:var(--ink-3);letter-spacing:2px}
.stat-hero .big{font-family:var(--mono);font-size:34px;line-height:1.15;color:#1A5FA8}
.stat-hero .big small{font-size:13px;color:var(--ink-2);margin-left:4px}
.substats{display:flex;margin-top:10px;border-top:1px solid var(--line-soft);padding-top:9px}
.substats div{flex:1}
.substats .k{font-size:10.5px;color:var(--ink-3);display:block}
.substats .v{font-family:var(--mono);font-size:14px;color:#1A2B3C}

.bar-row{margin-bottom:10px}
.bar-top{display:flex;align-items:baseline;gap:6px;margin-bottom:3px}
.bar-name{font-size:12px;color:var(--ink)}
.bar-name em{font-style:normal;color:var(--ink-3);font-size:10.5px;margin-left:4px}
.bar-val{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:#1A2B3C}
.bar-track{position:relative;height:9px;background:#E4EDF7;border:1px solid var(--line-soft);overflow:hidden}
.bar-fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(to bottom,#8FC4EE,#5AA3E0)}
.bar-fill[data-state="done"]{background:linear-gradient(to bottom,#8FD6AE,#4FB07E)}
.bar-fill[data-state="low"]{background:#C6D3E0}
.bar-target{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--red)}
.bar-legend{font-size:10.5px;color:var(--ink-3);display:flex;align-items:center;gap:5px;margin-top:3px}
.bar-legend i{width:2px;height:9px;background:var(--red);display:inline-block}

.setting{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.setting:last-of-type{border-bottom:0}
.setting .lbl{flex:1;min-width:0}
.setting .lbl b{display:block;font-size:12.5px;font-weight:400;color:var(--ink)}
.setting .lbl span{font-size:11px;color:var(--ink-3);line-height:1.5;display:block}
.setting input[type=text],.setting input[type=number]{
  width:150px;height:24px;padding:0 7px;font-size:12px;
  border:1px solid var(--line);border-radius:var(--r);background:#fff;font-family:var(--sans);
}

<script>
(function(){
"use strict";

/* ============================================================================
   0. 工具
   ========================================================================== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const pad2 = n => (n < 10 ? "0" : "") + n;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const num = n => (n || 0).toLocaleString("en-US");

const EX_KEY = "fakao.exam.v2";
const WK_KEY = "fakao.work.v2";
const SET_KEY = "fakao.settings.v2";

/* 字数：非空白字符数（含标点），与考试系统口径一致 */
const RE_HAN = /[㐀-䶿一-鿿豈-﫿]/g;
function countText(s){
  s = s || "";
  if (!s) return { total:0, han:0, latin:0, punct:0, paras:0 };
  const nows = s.replace(/\s/g, "");
  const han   = (s.match(RE_HAN) || []).length;
  const latin = (s.match(/[A-Za-z0-9]/g) || []).length;
  return {
    total: nows.length, han: han, latin: latin,
    punct: Math.max(0, nows.length - han - latin),
    paras: s.split(/\n+/).filter(t => t.trim()).length
  };
}
function fmtDur(ms){
  ms = Math.max(0, ms);
  const t = Math.floor(ms / 1000);
  return pad2(Math.floor(t / 3600)) + ":" + pad2(Math.floor(t % 3600 / 60)) + ":" + pad2(t % 60);
}
function fmtClock(ts){ const d = new Date(ts); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()); }
function fmtStamp(ts){ const d = new Date(ts); return (d.getMonth()+1) + "月" + d.getDate() + "日 " + fmtClock(ts); }
function fmtSpeed(chars, ms){
  if (!ms || ms < 30000 || !chars) return "";
  return "约 " + num(Math.round(chars / (ms / 3600000))) + " 字/小时";
}

const BAD_NAME_CHARS = '\\/:*?"<>|';
const BOM_CHAR = String.fromCharCode(0xFEFF);
function sanitizeName(s){
  const str = String(s == null ? "" : s);
  let out = "";
  for (let i = 0; i < str.length; i++){
    const ch = str.charAt(i), code = str.charCodeAt(i);
    out += (code < 32 || code === 127 || BAD_NAME_CHARS.indexOf(ch) >= 0) ? "-" : ch;
  }
  return out.replace(/\s+/g, " ").trim().slice(0, 92) || "导出";
}

function copyText(text){
  const fallback = () => {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;top:-9999px;opacity:0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch(e){ return false; }
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(() => true).catch(fallback);
  }
  return Promise.resolve(fallback());
}
let toastTimer = null;
function toast(msg){
  const el = $("#toast");
  el.textContent = msg; el.dataset.on = "1";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.dataset.on = "0"; }, 1900);
}

/* ============================================================================
   1. 题库：题 → 问 两层。问 才是作答单位。
   ========================================================================== */
/* 空白练习卷：材料自己填，这里只给占位结构。
   空材料/空问题在渲染时显示提示文字，不往数据里塞占位符。 */
const BLANK_Q = 3;                       // 默认几道题
function blankQuestion(no){
  return {
    id: "q" + no, no: no, name: "第" + no + "题", optional: false, target: 800,
    material: [], asks: [""], reqs: [], laws: []
  };
}
function blankExam(n){
  const qs = [];
  for (let i = 1; i <= (n || BLANK_Q); i++) qs.push(blankQuestion(i));
  return {
    meta: {
      examName: "主观题练习",
      candidate: { name: "练习者", sex: "—", no: "—", id: "—" },
      durationMin: 240
    },
    questions: qs
  };
}
/* ============================================================================
   2. 状态
   作答键 = "题id#问序号"
   ========================================================================== */
let EXAM = null;
let W = null;
let SET = { afs:15, mfs:15, autosnap:true, indent:true, style:"blue", autoFile:true, fileScope:"answers" };

const keyOf = (qid, ai) => qid + "#" + ai;
const qById = id => EXAM.questions.filter(q => q.id === id)[0];
const curQ = () => qById(W.cur.qid) || EXAM.questions[0];
// 每道题至少有一个「问」，否则问题标签条会空掉
const curAskCount = q => Math.max(1, (q.asks || []).length);
const allKeys = () => {
  const out = [];
  EXAM.questions.forEach(q => { for (let i = 0; i < curAskCount(q); i++) out.push(keyOf(q.id, i)); });
  return out;
};
const ansOf = k => W.answers[k] || "";

function defaultWork(){
  const answers = {}, marks = {}, history = {};
  allKeys().forEach(k => { answers[k] = ""; marks[k] = false; history[k] = []; });
  return {
    answers: answers, marks: marks, history: history,
    cur: { qid: EXAM.questions[0].id, ai: 0 },
    elapsedMs: 0, running: false, startedAt: null
  };
}
function readJSON(k){ try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function writeJSON(k, v){
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch(e){
    if (pruneHistory(0.5)){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e2){} }
    return false;
  }
}

function boot(){
  EXAM = readJSON(EX_KEY);
  if (!EXAM || !EXAM.questions || !EXAM.questions.length || !EXAM.questions[0].asks){
    EXAM = blankExam();
    writeJSON(EX_KEY, EXAM);
  }
  const s = readJSON(SET_KEY);
  if (s) Object.assign(SET, s);

  W = readJSON(WK_KEY);
  if (!W || !W.answers) W = defaultWork();
  // 上次会话的计时不该继续跑，恢复成静止的累计值
  W.running = false;
  W.accumMs = W.elapsedMs || 0;
  if (!W.cur || !qById(W.cur.qid)) W.cur = { qid: EXAM.questions[0].id, ai: 0 };
  W.cur.ai = clamp(W.cur.ai | 0, 0, Math.max(0, curAskCount(curQ()) - 1));
  allKeys().forEach(k => {
    if (typeof W.answers[k] !== "string") W.answers[k] = "";
    if (typeof W.marks[k] !== "boolean") W.marks[k] = false;
    if (!Array.isArray(W.history[k])) W.history[k] = [];
  });
  Object.keys(W.answers).forEach(k => {
    if (allKeys().indexOf(k) < 0){ delete W.answers[k]; delete W.marks[k]; delete W.history[k]; }
  });
}

/* ---------- 快照 ---------- */
const SNAP_CAP_PER_Q = 60;
const SNAP_MIN_MS    = 60000;
const SNAP_MIN_DELTA = 300;
const SNAP_BUDGET    = 1200000;

function snapshot(key, kind, force){
  const text = ansOf(key);
  // 编辑题目会让「问」的个数变化，新键可能还没进 history，这里兜一下
  const list = W.history[key] || (W.history[key] = []);
  const last = list[list.length - 1];
  if (last && last.text === text) return false;
  if (!force && last){
    const dt = Date.now() - last.ts;
    const dd = Math.abs(countText(text).total - last.chars);
    if (dt < SNAP_MIN_MS && dd < SNAP_MIN_DELTA) return false;
  }
  list.push({ ts: Date.now(), text: text, chars: countText(text).total, kind: kind || "auto" });
  while (list.length > SNAP_CAP_PER_Q) list.shift();
  pruneHistory(1);
  return true;
}
function pruneHistory(keepRatio){
  let total = 0; const all = [];
  const ids = Object.keys(W.history);
  ids.forEach(k => {
    (W.history[k] || []).forEach((h, i, arr) => {
      total += h.text.length;
      all.push({ k:k, i:i, ts:h.ts, len:h.text.length, last: i === arr.length - 1 });
    });
  });
  if (total <= SNAP_BUDGET) return false;
  const target = SNAP_BUDGET * (keepRatio == null ? 0.8 : keepRatio);
  all.sort((a, b) => b.ts - a.ts);
  const keep = {}; let acc = 0, changed = false;
  all.forEach(it => {
    if (it.last || acc + it.len <= target){ keep[it.k + ":" + it.i] = 1; acc += it.len; }
    else changed = true;
  });
  if (!changed) return false;
  ids.forEach(k => { W.history[k] = (W.history[k] || []).filter((h, i) => keep[k + ":" + i]); });
  return true;
}

function diffParts(prev, cur){
  let p = 0;
  const minLen = Math.min(prev.length, cur.length);
  while (p < minLen && prev.charCodeAt(p) === cur.charCodeAt(p)) p++;
  let s = 0;
  while (s < minLen - p && prev.charCodeAt(prev.length-1-s) === cur.charCodeAt(cur.length-1-s)) s++;
  const a = prev.slice(p, prev.length - s), b = cur.slice(p, cur.length - s);
  const out = [];
  const push = (t, str) => { if (!str) return; const l = out[out.length-1]; if (l && l.t === t) l.s += str; else out.push({t:t, s:str}); };
  if (p) push("=", cur.slice(0, p));
  if (a.length * b.length > 1600000){ push("-", a); push("+", b); }
  else {
    const n = a.length, m = b.length;
    const dp = new Uint32Array((n+1)*(m+1));
    for (let i = n-1; i >= 0; i--){
      const row = i*(m+1), nxt = (i+1)*(m+1);
      for (let j = m-1; j >= 0; j--){
        dp[row+j] = a.charCodeAt(i) === b.charCodeAt(j) ? dp[nxt+j+1] + 1 : Math.max(dp[nxt+j], dp[row+j+1]);
      }
    }
    let i = 0, j = 0;
    while (i < n && j < m){
      if (a.charCodeAt(i) === b.charCodeAt(j)){ push("=", a[i]); i++; j++; }
      else if (dp[(i+1)*(m+1)+j] >= dp[i*(m+1)+j+1]){ push("-", a[i]); i++; }
      else { push("+", b[j]); j++; }
    }
    while (i < n) push("-", a[i++]);
    while (j < m) push("+", b[j++]);
  }
  if (s) push("=", cur.slice(cur.length - s));
  return out;
}

function renderHistDetail(){
  const list = W.history[curKey()] || [];
  const idx = list.map((h, i) => i).filter(i => list[i].ts === histOpenTs)[0];
  if (idx == null){ $("#histDetail").innerHTML = ""; return; }
  const h = list[idx], prev = idx > 0 ? list[idx-1] : null;
  const d = prev ? h.chars - prev.chars : h.chars;
  let body;
  if (histMode === "diff" && prev){

      if (pt.t === "+") return "<ins>" + esc(pt.s) + "</ins>";

      if (str.length > 240) return esc(str.slice(0,90)) + '<span class="gap">  ……略 ' + (str.length-180) + ' 字……  </span>' + esc(str.slice(-90));
      return esc(str);
    }).join("") + '</div>';

  }

function blobDownload(filename, text, mime, bom){
  try {
    const blob = new Blob([(bom ? BOM_CHAR : "") + text], { type: mime + ";charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.rel = "noopener";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 2000);
    return "attempted";
  } catch(e){ return "failed"; }
}
function saveFile(filename, text, fmtKey){
  const f = FMT[fmtKey] || FMT.txt;
  if (window.showSaveFilePicker && !pickerBlocked){
    const types = [{ description: f.label, accept: {} }];
    types[0].accept[f.mime] = ["." + f.ext];
    return window.showSaveFilePicker({ suggestedName: filename, types: types })
      .then(h => h.createWritable())
      .then(w => w.write(new Blob([(f.bom ? BOM_CHAR : "") + text], { type: f.mime + ";charset=utf-8" })).then(() => w.close()))
      .then(() => "saved")
      .catch(err => {
        if (err && err.name === "AbortError") return "cancelled";
        pickerBlocked = true;
        return blobDownload(filename, text, f.mime, f.bom);
      });
  }
  return Promise.resolve(blobDownload(filename, text, f.mime, f.bom));
}

function histBlock(q, k, md){
  const list = W.history[k] || [];
  const L = [];
  const head = "第" + q.no + "题 · " + q.name + " · 问题" + (parseInt(k.split("#")[1], 10) + 1);
  L.push(md ? "### " + head : "── " + head + " ──");
  const c = countText(ansOf(k));
  L.push((md ? "*" : "") + "最终 " + num(c.total) + " 字 · 共 " + list.length + " 个快照" + (md ? "*" : ""));
  L.push("");
  if (!list.length){ L.push("（无历史快照）"); L.push(""); return L.join("\n"); }
  list.forEach((h, i) => {
    const prev = i > 0 ? list[i-1] : null;
    const d = prev ? h.chars - prev.chars : h.chars;
    const meta = "第 " + (i+1) + " 版 · " + fmtStamp(h.ts) + " · " + num(h.chars) + " 字" +
                 (prev ? "（较上一版 " + (d > 0 ? "+" : "") + num(d) + "）" : "");
    L.push(md ? "**" + meta + "**" : "· " + meta);
    L.push(md ? "" : "─".repeat(46));
    L.push(h.text || "（空白）");
    L.push("");
  });
  return L.join("\n");
}

function buildExport(scope, qid, fmt, range){
  const now = Date.now();
  const md = fmt === "md";
  if (fmt === "json"){
    if (scope === "archive") return JSON.stringify({ kind:"archive", version:2, exportedAt:now, exam:EXAM, work:W }, null, 2);
    return JSON.stringify({ kind:"answers", version:2, exportedAt:now,
      examName:EXAM.meta.examName, answers:W.answers, marks:W.marks, history:W.history,
      elapsedMs:W.elapsedMs, startedAt:W.startedAt }, null, 2);
  }
  const tot = totalChars();
  const L = [];
  L.push(md ? "# 法考主观题练习 · " + (scope === "answers" ? "答卷" : "历史记录")
            : "法考主观题练习 · " + (scope === "answers" ? "答卷" : "历史记录"));
  L.push(md ? "" : "═".repeat(56));
  L.push((md ? "- " : "") + "试卷：" + EXAM.meta.examName);
  L.push((md ? "- " : "") + "导出时间：" + fmtStamp(now));
  L.push((md ? "- " : "") + "全文总计：" + num(tot) + " 字");
  L.push((md ? "- " : "") + "用时：" + (W.elapsedMs ? fmtDur(W.elapsedMs) : "未计时"));
  L.push(md ? "" : "═".repeat(56));
  L.push("");

  let qs;
  if (scope === "answers") qs = EXAM.questions;
  else if (range === "q") qs = [qById(qid) || curQ()];
  else qs = EXAM.questions;

  qs.forEach(q => {
    if (scope === "answers"){
      let total = 0;
      const parts = [];
      for (let i = 0; i < curAskCount(q); i++){
        const k = keyOf(q.id, i), c = countText(ansOf(k));
        total += c.total;
        parts.push("【问题" + (i + 1) + "】" + esc(q.asks[i]));
        parts.push("");
        parts.push(ansOf(k) || "（未作答）");
        parts.push("（" + num(c.total) + " 字）");
        parts.push("");
      }
      const head = "第" + q.no + "题 · " + q.name + (q.optional ? "（选做）" : "");
      L.push(md ? "## " + head : "━━━ " + head + " ━━━");
      L.push((md ? "*" : "") + num(total) + " 字 · 建议 " + num(q.target || 0) + " 字" + (md ? "*" : ""));
      L.push("");
      L.push(parts.join("\n"));
    } else {
      for (let i = 0; i < curAskCount(q); i++) L.push(histBlock(q, keyOf(q.id, i), md));
    }
  });
  return L.join("\n").replace(/\n{3,}/g, "\n\n\n");
}

// 题目名默认就是「第N题」，别再拼一次
const qLabel = q => {

};
function defaultSaveName(){

function fileContent(){
  if (SET.fileScope === "q"){

      parts.push("【问题" + (i + 1) + "】" + q.asks[i], "", ansOf(k) || "（未作答）", "（" + num(c.total) + " 字）", "");

function renderFileChip(){

function bindFile(){

    suggestedName: defaultSaveName(),

  }).then(h => { fileHandle = h; renderFileChip(); return true; })
    .catch(err => { if (!err || err.name !== "AbortError") pickerBlocked = true; return false; });

function writeToFile(){
  if (!fileHandle) return Promise.resolve(false);
  return fileHandle.createWritable()
    .then(w => w.write(new Blob([BOM_CHAR + fileContent()], { type:"text/plain;charset=utf-8" })).then(() => w.close()))
    .then(() => { lastFileWrite = Date.now(); renderFileChip(); return true; })
    .catch(() => false);
}
function fallbackDownload(){
  const res = blobDownload(defaultSaveName(), fileContent(), "text/plain", true);
  toast(res === "attempted" ? "已触发下载——若无文件出现，请用「保存到文件」里的复制" : "保存失败，请改用「保存到文件」里的复制");
}
function quickSave(){
  W.answers[curKey()] = $("#answer").value;
  const snapped = snapshot(curKey(), "manual", true);
  saveNow(true);
  if ($("#drawer").dataset.open === "1") renderHistory();
  const tail = snapped ? "" : "（内容未变）";
  if (fileHandle){
    return writeToFile().then(ok => toast(ok ? "已保存到 " + fileHandle.name : "写入文件失败，内容已存在浏览器里"));
  }
  if (window.showSaveFilePicker && !pickerBlocked){
    return bindFile().then(bound => {
      if (!bound){
        if (pickerBlocked) return fallbackDownload();
        toast("未选择文件" + tail + "，内容已存在浏览器里"); return;
      }
      return writeToFile().then(ok => toast(ok ? "已保存到 " + fileHandle.name + "，之后 Ctrl+S 直接覆盖" : "文件已绑定，但写入失败"));
    });
  }
  fallbackDownload();
  return Promise.resolve();
}

function goto(qid, ai){
  W.answers[curKey()] = $("#answer").value;
  if (SET.autosnap) snapshot(curKey(), "auto", false);
  const q = qById(qid) || EXAM.questions[0];
  W.cur = { qid: q.id, ai: clamp(ai == null ? 0 : ai, 0, Math.max(0, curAskCount(q) - 1)) };
  histOpenTs = null;
  renderChips(); renderAskTabs(); renderMaterial(); renderAnswer();
  saveSoon();
  $("#answer").focus();
  if ($("#drawer").dataset.open === "1"){ renderHistory(); renderStats(); }
}
function stepQ(d){
  const i = EXAM.questions.map(q => q.id).indexOf(W.cur.qid);
  const j = clamp(i + d, 0, EXAM.questions.length - 1);
  if (j !== i) goto(EXAM.questions[j].id, 0);
}
function stepA(d){
  const q = curQ(), n = curAskCount(q);
  const j = W.cur.ai + d;
  if (j >= 0 && j < n){ goto(q.id, j); return; }
  const i = EXAM.questions.map(x => x.id).indexOf(q.id);
  const k = i + (d > 0 ? 1 : -1);
  if (k >= 0 && k < EXAM.questions.length) goto(EXAM.questions[k].id, d > 0 ? 0 : curAskCount(EXAM.questions[k]) - 1);
}

let timerId = null;
function tick(){
  if (W.running){
    W.accumMs = W.accumMs || 0;
    W.elapsedMs = W.accumMs + (Date.now() - W.runFrom);
  }
  $("#clock").textContent = fmtDur(W.elapsedMs || 0);
}
function timerStart(){
  if (W.running) return;
  W.running = true; W.runFrom = Date.now(); W.accumMs = W.elapsedMs || 0;
  if (!W.startedAt) W.startedAt = Date.now();
  saveSoon();
}
function timerStop(){
  if (!W.running) return;
  W.elapsedMs = (W.accumMs || 0) + (Date.now() - W.runFrom);
  W.running = false; W.accumMs = W.elapsedMs;
  saveSoon();
}

function doSubmit(){
  W.answers[curKey()] = $("#answer").value;
  const rows = EXAM.questions.map(q => {
    let total = 0, done = 0;
    for (let i = 0; i < curAskCount(q); i++){
      const c = countText(ansOf(keyOf(q.id, i))).total;
      total += c; if (c > 0) done++;
    }
    return { q:q, total:total, done:done, n:curAskCount(q) };
  });
  const empty = rows.filter(r => r.done < r.n);
  const tot = rows.reduce((s, r) => s + r.total, 0);
  let body = "";
  if (empty.length){
    body += '<div class="notice"><span>!</span><span>还有 ' + empty.length + ' 道题存在未作答的问：' +
      empty.map(r => "第" + r.q.no + "题(" + (r.n - r.done) + "问)").join("、") + '。交卷后将不能再修改。</span></div>';
  }
  body += rows.map(r =>
    '<div class="checkline" data-state="' + (r.done === r.n ? "" : "empty") + '">' +
      '<span class="n">' + r.q.no + '</span><span>' + esc(r.q.name) + (r.q.optional ? ' <span style="color:var(--ink-3);font-size:11px">选做</span>' : '') + '</span>' +
      '<span class="c">' + r.done + '/' + r.n + ' 问 · ' + num(r.total) + ' 字</span></div>'
  ).join("");
  openModal({
    title: "确认交卷？",
    sub: "全文 " + num(tot) + " 字 · 用时 " + fmtDur(W.elapsedMs || 0),
    body: body,
    foot: '<button class="btn3d" data-act="cancel">继续作答</button>' +
          '<button class="btn3d" data-act="ok" data-autofocus>确认交卷</button>'
  });
}
function doFinish(){
  timerStop();
  W.answers[curKey()] = $("#answer").value;
  allKeys().forEach(k => snapshot(k, "auto", true));
  saveNow(true);
  const rows = EXAM.questions.map(q => {
    let total = 0, done = 0;
    for (let i = 0; i < curAskCount(q); i++){
      const c = countText(ansOf(keyOf(q.id, i))).total;
      total += c; if (c > 0) done++;
    }
    return { q:q, total:total, done:done, n:curAskCount(q) };
  });
  const tot = rows.reduce((s, r) => s + r.total, 0);
  const snaps = allKeys().reduce((s, k) => s + (W.history[k] || []).length, 0);
  openModal({
    title: "已交卷",
    sub: "答卷与全部历史快照已保存在本机",
    body:
      '<div class="summary-grid">' +
        '<div class="cell"><span class="k">总字数</span><span class="v">' + num(tot) + '<small>字</small></span></div>' +
        '<div class="cell"><span class="k">用时</span><span class="v">' + fmtDur(W.elapsedMs || 0) + '</span></div>' +
        '<div class="cell"><span class="k">已答</span><span class="v">' + rows.reduce((s,r)=>s+r.done,0) + '<small>/ ' + rows.reduce((s,r)=>s+r.n,0) + ' 问</small></span></div>' +
        '<div class="cell"><span class="k">历史快照</span><span class="v">' + snaps + '<small>版</small></span></div>' +
      '</div>' +
      '<div class="sec-title">各题字数</div>' +
      rows.map(r => '<div class="checkline"><span class="n">' + r.q.no + '</span><span>' + esc(r.q.name) + '</span>' +
        '<span class="c">' + num(r.total) + ' 字</span></div>').join(""),
    foot: '<button class="btn3d" data-act="export">保存答卷到文件</button>' +
          '<button class="btn3d" data-act="close">继续查看</button>' +
          '<button class="btn3d" data-act="restart" data-autofocus>重新计时</button>'
  });
}

function finishImport(msg){
  if (!W.cur || !qById(W.cur.qid)) W.cur = { qid: EXAM.questions[0].id, ai: 0 };
  W.cur.ai = clamp(W.cur.ai | 0, 0, Math.max(0, curAskCount(curQ()) - 1));
  allKeys().forEach(k => {
    if (typeof W.answers[k] !== "string") W.answers[k] = "";
    if (typeof W.marks[k] !== "boolean") W.marks[k] = false;
    if (!Array.isArray(W.history[k])) W.history[k] = [];
  });
  W.accumMs = W.elapsedMs || 0;
  $("#examName").textContent = EXAM.meta.examName;
  renderChips(); renderAskTabs(); renderMaterial(); renderAnswer(); renderFileChip(); tick();
  saveNow(true);
  if ($("#drawer").dataset.open === "1"){ renderHistory(); renderStats(); renderSettings(); }
  toast(msg);
}
function modalLikely(t){ const h = $("#mhost .modal-head h2"); return h && h.textContent.indexOf(t) === 0; }

/* ---------- 增删题目 ---------- */
function renumber(){ EXAM.questions.forEach((q, i) => { q.no = i + 1; }); }
function ensureWorkKeys(){
  allKeys().forEach(k => {
    if (typeof W.answers[k] !== "string") W.answers[k] = "";
    if (typeof W.marks[k] !== "boolean") W.marks[k] = false;
    if (!Array.isArray(W.history[k])) W.history[k] = [];
  });
}
function addQuestion(){
  W.answers[curKey()] = $("#answer").value;
  let i = 1;
  while (qById("q" + i)) i++;
  const q = blankQuestion(EXAM.questions.length + 1);
  q.id = "q" + i;
  EXAM.questions.push(q);
  renumber();
  writeJSON(EX_KEY, EXAM);
  ensureWorkKeys();
  W.cur = { qid: q.id, ai: 0 };
  histOpenTs = null;
  renderChips(); renderAskTabs(); renderMaterial(); renderAnswer();
  saveNow(true);
  editCurrent();                       // 建完直接弹编辑框，省一步
}
function deleteQuestion(){
  if (EXAM.questions.length <= 1){ toast("至少要保留一道题"); return; }
  const q = curQ();
  let chars = 0;
  for (let i = 0; i < curAskCount(q); i++) chars += countText(ansOf(keyOf(q.id, i))).total;
  openModal({
    title: "删除第" + q.no + "题？",
    sub: q.name + " · " + curAskCount(q) + " 问 · " + num(chars) + " 字",
    body: '<div class="notice"><span>!</span><span>会连同这道题的作答与全部历史快照一起删掉，不可撤销。</span></div>',
    foot: '<button class="btn3d" data-act="cancel">取消</button>' +
          '<button class="btn3d" data-act="ok" data-autofocus>确认删除</button>',
    onClose: () => { W._pending = null; }
  });
  W._pending = { type:"delQ", qid:q.id };
}
function doDeleteQuestion(qid){
  const q = qById(qid);
  const i = EXAM.questions.indexOf(q);
  if (i < 0){ closeModal(); return; }
  Object.keys(W.answers).forEach(k => {
    if (k.indexOf(q.id + "#") === 0){ delete W.answers[k]; delete W.marks[k]; delete W.history[k]; }
  });
  EXAM.questions.splice(i, 1);
  renumber();
  writeJSON(EX_KEY, EXAM);
  const nx = EXAM.questions[Math.min(i, EXAM.questions.length - 1)];
  W.cur = { qid: nx.id, ai: 0 };
  histOpenTs = null;
  closeModal();
  renderChips(); renderAskTabs(); renderMaterial(); renderAnswer(); renderSettings();
  saveNow(true);
  toast("已删除");
}
function parseMaterial(text){
  const out = [];
  text.split(/\n{2,}/).forEach(block => {
    const lines = block.split("\n");
    let head = "";
    if (/^##\s*/.test(lines[0].trim())) head = lines.shift().trim().replace(/^##\s*/, "");
    const body = lines.join("\n").trim();
    if (head) out.push({ t:"[" + head + "] " + body });
    else if (body) out.push({ t:body });
  });
  return out;
}
function editCurrent(){
  const q = curQ();
  const matText = (q.material || []).map(m => m.t).join("\n\n");
  openModal({
    title: "编辑第" + q.no + "题",
    sub: "材料空行分段；行首 ## 会渲染成 [小标题]",
    body:
      '<div class="field"><label>科目名</label><input type="text" id="edName" value="' + esc(q.name) + '"></div>' +
      '<div class="field"><label>建议字数</label><input type="text" id="edTarget" value="' + (q.target || "") + '" style="font-family:var(--mono)"></div>' +
      '<div class="field"><label>材料</label><textarea id="edMat" rows="10">' + esc(matText) + '</textarea></div>' +
      '<div class="field"><label>问题（每行一问，对应一个「问题N」标签）</label><textarea id="edAsk" rows="6">' + esc((q.asks || []).join("\n")) + '</textarea></div>' +
      '<div class="field"><label>答题要求（每行一条）</label><textarea id="edReq" rows="3">' + esc((q.reqs || []).join("\n")) + '</textarea></div>' +
      '<div class="field"><label>参考法条（每行一条，支持 HTML）</label><textarea id="edLaws" rows="4">' + esc((q.laws || []).join("\n")) + '</textarea></div>',
    foot: (EXAM.questions.length > 1 ? '<button class="btn3d" id="edDel">删除本题</button>' : '') +
          '<button class="btn3d" data-act="cancel" style="margin-left:auto">取消</button>' +
          '<button class="btn3d" data-act="ok" data-autofocus>保存</button>',
    onClose: () => { W._pending = null; }
  });
  W._pending = { type:"edit", qid:q.id };
  const del = $("#edDel");
  if (del) del.addEventListener("click", () => { W._pending = null; deleteQuestion(); });
}

/* ============================================================================
   9. 启动
   ========================================================================== */
function start(){
  boot();
  const c = EXAM.meta.candidate || {};
  $("#cName").textContent = c.name || "";
  $("#cSex").textContent = c.sex || "";
  $("#cNo").textContent = c.no || "";
  $("#cId").textContent = c.id || "";
  $("#examName").textContent = EXAM.meta.examName;
  document.documentElement.style.setProperty("--mfs", SET.mfs + "px");
  document.documentElement.style.setProperty("--afs", SET.afs + "px");

  renderChips(); renderAskTabs(); renderMaterial(); renderAnswer(); renderFileChip();
  bind();
  W.accumMs = W.elapsedMs || 0;
  tick();
  timerId = setInterval(tick, 1000);

  setInterval(() => { if (W.running) saveNow(true); }, 30000);
  setInterval(() => {
    if (!fileHandle || !SET.autoFile) return;
    if (lastEditAt <= lastFileWrite) return;
    writeToFile();
  }, 30000);

  $("#answer").focus();
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
else start();

})();
</script>
